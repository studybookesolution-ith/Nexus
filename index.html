<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading...</title>

<link rel="icon" href="favicon.ico" type="image/x-icon">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    height:100vh;
    background:#ffffff;
    font-family:Arial,sans-serif;
}

.logo{
    width:96px;
    height:96px;
    margin-bottom:20px;
}

.spinner{
    width:42px;
    height:42px;
    border:4px solid #e5e5e5;
    border-top:4px solid #1976d2;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

p{
    margin-top:18px;
    color:#555;
    font-size:16px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>

<script>
window.onload = function () {
    setTimeout(function () {
        window.location.href = "https://script.google.com/macros/s/AKfycbzGusSlhNoVxHgU_edAWr7H6EzPWuUlaMDJlPzGRP7cHni_zXzXXCdyJVeQUy4nEcIw/exec";
    },1000);
};
</script>

</head>
<body>

<img src="favicon.ico" class="logo" alt="Logo">

<div class="spinner"></div>

<p>Loading...</p>

</body>
</html>
