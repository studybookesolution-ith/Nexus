<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Web App</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            height:100vh;
            background:#ffffff;
            font-family:Arial, Helvetica, sans-serif;
        }

        img{
            width:120px;
            height:120px;
            object-fit:contain;
            margin-bottom:20px;
        }

        h2{
            color:#222;
            margin-bottom:10px;
        }

        p{
            color:#666;
            font-size:16px;
        }

        .loader{
            width:40px;
            height:40px;
            border:4px solid #ddd;
            border-top:4px solid #4285F4;
            border-radius:50%;
            animation:spin 1s linear infinite;
            margin-top:20px;
        }

        @keyframes spin{
            100%{
                transform:rotate(360deg);
            }
        }
    </style>

    <script>
        setTimeout(function () {
            window.location.replace(
                "https://script.google.com/macros/s/AKfycbzGusSlhNoVxHgU_edAWr7H6EzPWuUlaMDJlPzGRP7cHni_zXzXXCdyJVeQUy4nEcIw/exec"
            );
        }, 2000);
    </script>

</head>
<body>

    <img src="logo.png" alt="Logo">

    <h2>Welcome</h2>

    <p>Loading application...</p>

    <div class="loader"></div>

</body>
</html>
